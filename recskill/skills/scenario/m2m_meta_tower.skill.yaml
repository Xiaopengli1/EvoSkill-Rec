name: m2m_meta_tower
category: scenario
description: Apply M2M meta attention and meta tower modules conditioned on a domain embedding.
inputs:
  - name: flat_embeddings
    shape: "[batch_size, input_dim]"
    dtype: float32
  - name: domain_context
    shape: "[batch_size, domain_dim]"
    dtype: float32
outputs:
  - name: prediction
    shape: "[batch_size]"
    dtype: float32
task_types: [multi_domain, ctr, ranking]
inductive_bias:
  - meta_attention
  - scenario_conditioned_tower
failure_signatures:
  - input_dim_mismatch
  - domain_dim_mismatch
good_for:
  - M2M-style multi-domain CTR models using a domain embedding to generate meta-attention and meta-tower weights
bad_for:
  - models that select outputs from explicit per-domain towers without meta conditioning
compatible_with:
  upstream:
    - field_embedding
    - flatten_field_embeddings
  downstream:
    - bce_loss
source:
  file: torch_rechub/models/multi_domain/m2m.py
  class_or_function: M2M
  extraction_type: wrapped
retrieval:
  summary: "Use this for M2M-style meta attention over experts with a scenario/domain embedding."
  use_when:
    - "The model has a separate embedded domain feature that conditions expert routing and tower weights."
    - "Expert outputs should be mixed by meta-attention generated from scenario context."
  avoid_when:
    - "The architecture only needs hard selection by domain id."
  task_types: [multi_domain, ctr, ranking]
  architecture_roles: [meta_attention, scenario_conditioned_tower, expert_mixer]
  input_modalities: [flat_embeddings, domain_context]
  output_semantics: [prediction]
  objectives: [multi_domain_prediction, click_prediction]
  model_families: [M2M]
  aliases: [M2M, meta attention tower, meta tower, scenario-conditioned experts]
  query_examples:
    - "M2M meta tower"
    - "domain embedding conditioned expert attention"
composition:
  requires: [flat_embeddings, domain_context]
  produces: [prediction]
  common_upstream: [field_embedding, flatten_field_embeddings]
  common_downstream: [bce_loss]
  example_genome_fragment:
    skill: m2m_meta_tower
    params:
      input_key: flat_embeddings
      domain_key: domain_context
      output_key: prediction
      input_dim: "${input_dim}"
      domain_dim: "${domain_dim}"
      num_experts: "${num_experts}"
