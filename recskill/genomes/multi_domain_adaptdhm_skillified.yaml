model_name: multi_domain_adaptdhm_skillified
task_type: multi_domain

inputs:
  sparse_features:
    shape: [batch_size, num_fields]
    dtype: int64

skills:
  - id: field_embedding
    skill: field_embedding
    params:
      vocab_sizes: ${vocab_sizes}
      embedding_dim: ${embedding_dim}

  - id: flatten
    skill: flatten_field_embeddings
    params:
      input_key: field_embeddings
      output_key: flat_embeddings

  - id: cluster_tower
    skill: adaptdhm_cluster_tower
    params:
      input_key: flat_embeddings
      output_key: prediction
      cluster_key: cluster_id
      input_dim: ${input_dim}
      fcn_dims: ${fcn_dims}
      cluster_num: ${cluster_num}
      beta: ${beta}
