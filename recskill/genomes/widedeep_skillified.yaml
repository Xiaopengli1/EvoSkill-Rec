model_name: widedeep_skillified
task_type: ctr

inputs:
  wide_features:
    shape: [batch_size, num_wide_fields]
    dtype: int64
  deep_features:
    shape: [batch_size, num_deep_fields]
    dtype: int64

skills:
  - id: wide_embedding
    skill: field_embedding
    params:
      input_key: wide_features
      output_key: wide_embeddings
      vocab_sizes: ${wide_vocab_sizes}
      embedding_dim: ${embedding_dim}

  - id: wide_flatten
    skill: flatten_field_embeddings
    params:
      input_key: wide_embeddings
      output_key: wide_flat

  - id: wide_logit
    skill: linear_logit
    params:
      input_key: wide_flat
      output_key: wide_logit
      input_dim: ${wide_input_dim}

  - id: deep_embedding
    skill: field_embedding
    params:
      input_key: deep_features
      output_key: deep_embeddings
      vocab_sizes: ${deep_vocab_sizes}
      embedding_dim: ${embedding_dim}

  - id: deep_flatten
    skill: flatten_field_embeddings
    params:
      input_key: deep_embeddings
      output_key: deep_flat

  - id: deep_tower
    skill: mlp_tower
    params:
      input_key: deep_flat
      output_key: deep_logit
      input_dim: ${deep_input_dim}
      hidden_dims: ${hidden_dims}
      dropout: 0.0
      activation: relu
      output_layer: true

  - id: fusion
    skill: additive_fusion
    params:
      input_keys: [wide_logit, deep_logit]
      output_key: logits

  - id: prediction
    skill: sigmoid_prediction
    params:
      input_key: logits
      output_key: prediction
