name: ffm_interaction
category: interaction
description: Field-aware-style pairwise crosses from field embeddings.
retrieval:
  summary: Use this for DeepFFM or FatDeepFFM shape-compatible field crosses.
  use_when: A genome needs pairwise field-aware feature products.
  avoid_when: The exact original 4D FFM embedding table is required.
  task_types: [ctr, ranking]
  architecture_roles: [ffm_cross, field_aware_cross]
  input_modalities: [field_embeddings]
  output_semantics: [ffm_interactions]
  objectives: [click_prediction]
  model_families: [DeepFFM, FatDeepFFM]
  aliases: [ffm, field aware, deepffm]
  query_examples: [DeepFFM field aware interaction]
composition:
  requires: [field_embeddings]
  produces: [ffm_interactions]
  common_upstream: [field_embedding, senet_feature_gate]
  common_downstream: [flatten_field_embeddings, mlp_tower]
  example_genome_fragment: "skill: ffm_interaction\nparams: {num_fields: 8, reduce_sum: false}"
