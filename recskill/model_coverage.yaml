schema_version: 1
coverage_levels:
  L0: Not skillified. No recskill genome exists.
  L1: Shape-compatible genome exists and dummy forward passes.
  L2: Main architecture path is decomposed into reusable skills.
  L3: Key intermediate shapes and short training smoke tests pass.
  L4: Behavior-compatible with original model interface and trainer path.
  L5: Ready for retrieval-driven composition and architecture mutation.
models:
- name: DeepFM
  domain: ranking
  source_file: torch_rechub/models/ranking/deepfm.py
  source_class: DeepFM
  status: L2
  genome: recskill/genomes/deepfm_skillified.yaml
  output_contract:
    logits: '[batch_size, 1]'
    loss: '[]'
  covered_components:
  - field_embedding
  - flatten_field_embeddings
  - linear_logit
  - fm_interaction
  - mlp_tower
  - additive_fusion
  - sigmoid_prediction
  - bce_loss
  - named_feature_dict_adapter
  - dense_feature_path
  missing_components: []
  tests:
  - tests/recskill/test_genome_build.py
  - tests/recskill/test_training_smoke.py
  - tests/recskill/test_model_genomes_shape_alignment.py
