# Multi-task (MTL) census-income autoresearch config with live Code-space.
# The run starts from an AITM-style initial genome.
#
# Two binary tasks trained jointly:
#   * income          -> task 0, CTR-style task
#   * marital status   -> task 1, CVR-style task
#
# Every Code-space round calls the two-stage LLM provider (planner ->
# synthesizer) with the current parent genome, recent evolution history,
# current failures, adaptive budget state, and dataset/runtime dimensions.

experiment_name: mtl_evolution_census_aitm_codespace
output_dir: outputs/evolution/mtl_census_aitm_codespace
memory_path:
write_metadata_files: true
write_summary_json: true
write_evolution_memory: true
write_code_space_diagnostics: true
write_survivor_artifacts: true
survivor_artifacts_dir: survivors

dataset:
  name: census_income_mtl
  type: census_mtl
  train_path: examples/ranking/data/census-income/census_income_train.csv
  val_path: examples/ranking/data/census-income/census_income_val.csv
  test_path: examples/ranking/data/census-income/census_income_test.csv
  label_cols: [income, marital status]
  task_names: [income_ctr, marital_cvr]
  task_types: [classification, classification]
  dense_cols:
    - age
    - wage per hour
    - capital gains
    - capital losses
    - divdends from stocks
    - num persons worked for employer
    - weeks worked in year

genome:
  template: aitm
  embedding_dim: 8
  shared_hidden_dims: [128, 64]
  task_hidden_dims: [32]
  expert_dim: 32
  num_experts: 4
  ple_shared_experts: 1
  ple_specific_experts: 1
  dropout: 0.1
  activation: relu

training:
  epoch: 20
  learning_rate: 0.001
  batch_size: 2048
  weight_decay: 0.0001
  device: cuda:0
  seed: 2022
  num_workers: 0
  earlystop_patience: 3
  objective_metric: auc
  min_delta: 0.0
  loss_key: loss
  logits_key: logits
  prediction_key: prediction

evolution:
  enabled: true
  rounds: 25
  candidate_budget: 8
  code_space_probability: 0.25
  adaptive_candidate_budget:
    enabled: true
    stagnation_patience: 2
    min_improvement: 0.001
    base_code_candidates: 2
    code_step: 2
    max_code_candidates: 6
    min_skill_candidates: 2
    reset_on_improvement: true
    cooldown_code_step: 1
  strategy: templates
  keep_top_k: 4
  survivor_top_k: 4
  deduplicate_architectures: true
  deduplicate_against_memory: true
  failure_modes: [negative_transfer_between_tasks, shared_bottom_underfitting]
  templates:
    - {name: swap_aitm, template: aitm, operation: replace}
    - {name: swap_mmoe, template: mmoe, operation: replace}
    - {name: swap_ple, template: ple, operation: replace}
    - {name: swap_task_specific, template: task_specific, operation: replace}
    - {name: mmoe_more_experts, template: mmoe, operation: specialize, num_experts: 8}
    - {name: wider_shared_bottom, template: shared_bottom, operation: specialize, shared_hidden_dims: [256, 128]}
  code_space:
    provider: creative_command
    command:
    planner_command: python tools/code_space_llm_provider.py --mode planner --task multitask
    synthesizer_command: python tools/code_space_llm_provider.py --mode synthesizer --task multitask
    max_retries: 2
    proposals_per_round: 2
    sketches_per_round: 12
    diversity_lanes: [field_embedding, shared_representation, task_representation, gating, interaction, routing]
    structural_scopes: [macro]
    scope_mix_strategy: sequential
    macro_requires_live_provider: true
    require_active_provider: true
    reuse_promoted_generated_skills: true
    reuse_promoted_code_skills: false
    allow_fallback_templates: false
    promotion_policy: survivor
