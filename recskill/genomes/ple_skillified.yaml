model_name: ple_skillified
task_type: multitask

inputs:
  sparse_features:
    shape: [batch_size, num_fields]
    dtype: int64

skills:
  - id: field_embedding
    skill: field_embedding
    params:
      vocab_sizes: ${vocab_sizes}
      embedding_dim: ${embedding_dim}

  - id: flatten
    skill: flatten_field_embeddings
    params:
      input_key: field_embeddings
      output_key: shared_input

  - id: ple_gate
    skill: ple_gate
    params:
      input_key: shared_input
      output_key: task_representations
      input_dim: ${input_dim}
      n_task: ${n_task}
      n_expert_shared: ${n_expert_shared}
      n_expert_specific: ${n_expert_specific}
      expert_hidden_dims: ${expert_hidden_dims}
      dropout: 0.0
      activation: relu

  - id: towers
    skill: task_tower
    params:
      input_key: task_representations
      output_key: task_outputs
      input_dim: ${expert_output_dim}
      task_types: ${task_types}
      tower_hidden_dims: ${tower_hidden_dims}
      dropout: 0.0
      activation: relu
