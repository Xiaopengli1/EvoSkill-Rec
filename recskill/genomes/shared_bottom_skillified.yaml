model_name: shared_bottom_skillified
task_type: multitask

inputs:
  sparse_features:
    shape: [batch_size, num_fields]
    dtype: int64

skills:
  - id: field_embedding
    skill: field_embedding
    params:
      vocab_sizes: ${vocab_sizes}
      embedding_dim: ${embedding_dim}

  - id: flatten
    skill: flatten_field_embeddings
    params:
      input_key: field_embeddings
      output_key: shared_input

  - id: bottom
    skill: shared_bottom_tower
    params:
      input_key: shared_input
      output_key: shared_representation
      input_dim: ${input_dim}
      hidden_dims: ${bottom_hidden_dims}
      dropout: 0.0
      activation: relu

  - id: fanout
    skill: task_replication
    params:
      input_key: shared_representation
      output_key: task_representations
      n_task: ${n_task}

  - id: towers
    skill: task_tower
    params:
      input_key: task_representations
      output_key: task_outputs
      input_dim: ${bottom_output_dim}
      task_types: ${task_types}
      tower_hidden_dims: ${tower_hidden_dims}
      dropout: 0.0
      activation: relu
