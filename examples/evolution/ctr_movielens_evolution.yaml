experiment_name: ctr_movielens_deepfm_evolution
output_dir: outputs/evolution/ctr_movielens_deepfm
memory_path:
write_metadata_files: false
write_summary_json: false
write_evolution_memory: false
write_code_space_diagnostics: false
write_survivor_artifacts: true
survivor_artifacts_dir: survivors

dataset:
  name: movielens_ctr
  type: movielens_ctr
  path: examples/matching/data/ml-1m/ml-1m.csv
  categorical_cols: [user_id, movie_id, gender, age, occupation, zip, cate_id]
  genre_col: genres
  derived_cate_col: cate_id
  rating_col: rating
  positive_rating_threshold: 4.0
  timestamp_col: timestamp
  temporal_split: true
  split_ratio: [0.7, 0.1, 0.2]

genome:
  # If genome_path is omitted, the workflow builds a Stage 2 DeepFM-like CTR genome.
  genome_path:
  template: deepfm
  embedding_dim: 16
  hidden_dims: [256, 128, 64]
  dropout: 0.2
  activation: relu

training:
  epoch: 5
  learning_rate: 0.001
  batch_size: 1024
  weight_decay: 0.0003
  device: cpu
  seed: 2022
  num_workers: 0
  earlystop_patience: 3
  objective_metric: auc
  min_delta: 0.0
  loss_key: loss
  logits_key: logits
  prediction_key: prediction

evolution:
  enabled: true
  rounds: 50
  candidate_budget: 10
  code_space_probability: 0.2
  adaptive_candidate_budget:
    # Total candidate_budget stays fixed; stagnant rounds shift quota from
    # skill-space to macro code-space for more open-ended architecture search.
    enabled: true
    stagnation_patience: 2
    min_improvement: 0.001
    base_code_candidates: 2
    code_step: 2
    max_code_candidates: 6
    min_skill_candidates: 4
    reset_on_improvement: true
    cooldown_code_step: 1
  strategy: skill_library
  failure_modes: [high_order_interaction_underfitting]
  keep_top_k: 4
  survivor_top_k: 4
  deduplicate_architectures: true
  deduplicate_against_memory: true
  code_space:
    # Code-space is macro-only: proposals must be generated by judging the
    # retained parent genome in real time and must perform architecture-level
    # transformations rather than local calibration/residual edits.
    # Use provider: command to call a local LLM wrapper that reads prompt JSON
    # from stdin and returns {"proposals": [OpenEndedProposal, ...]}.
    # Use provider: creative_command for two-stage open-ended code evolution.
    # The configured wrapper reads prompt JSON on stdin and writes JSON on stdout:
    #   1) planner_command returns {"sketches": [ArchitectureSketch, ...]}.
    #   2) synthesizer_command returns {"proposals": [OpenEndedProposal, ...]}.
    # Configure its model backend with EVOSKILLREC_CODE_SPACE_PROVIDER.
    # Supported values: codex (default), command, gemini, deepseek.
    # For command mode, set EVOSKILLREC_CODE_SPACE_BACKEND or stage-specific backend commands.
    # For Codex/Gemini/DeepSeek, set EVOSKILLREC_CODE_SPACE_MODEL or provider-specific model env vars.
    # Built-in deterministic code-space templates are disabled for this autoresearch config.
    provider: creative_command
    command:
    planner_command: python tools/code_space_llm_provider.py --mode planner
    synthesizer_command: python tools/code_space_llm_provider.py --mode synthesizer
    max_retries: 1
    proposals_per_round: 2
    sketches_per_round: 8
    diversity_lanes: [interaction, routing, fusion, embedding, tower, sequence]
    structural_scopes: [macro]
    scope_mix_strategy: sequential
    macro_requires_live_provider: true
    require_active_provider: true
    reuse_promoted_generated_skills: true
    reuse_promoted_code_skills: false
    allow_fallback_templates: false
    promotion_policy: survivor
  skill_graph_planner:
    # Set evolution.strategy: skill_graph_planner to use card-filtered graph search
    # instead of the legacy CTR template/library builder.
    card_top_k: 24
    per_category_top_k: 6
    beam_width: 12
    max_depth: 2
    candidate_pool_size: 40
    max_actions_per_state: 80
    operations: [add_branch, replace_node, insert_after, insert_before]
    operation_priors:
      add_branch: 1.0
      replace_node: 0.85
      insert_after: 0.9
      insert_before: 0.9
    allow_adapter_codegen: false
    allow_template_fallback: true
  templates:
    - name: add_crossnet_mix
      num_layers: 3
      low_rank: 8
      num_experts: 4
      evolution_space: skill_space
      operation: add
    - name: add_afm_attention
      attention_dim: 96
      evolution_space: skill_space
      operation: add
    - name: add_crossnet_v2
      num_layers: 3
      evolution_space: skill_space
      operation: add
    - name: replace_fm_with_field_sum
      evolution_space: skill_space
      operation: replace
    - name: remove_fm
      evolution_space: skill_space
      operation: replace
    - name: hybridize_crossnet_afm
      num_layers: 2
      attention_dim: 64
      evolution_space: skill_space
      operation: hybridize
    - name: add_autoint_attention
      num_layers: 2
      num_heads: 4
      dropout: 0.1
      evolution_space: skill_space
      operation: add
    - name: specialize_senet_fm
      reduction_ratio: 2
      evolution_space: skill_space
      operation: specialize
